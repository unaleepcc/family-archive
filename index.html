<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭紀錄網站 - 溫馨且珍貴的日常足跡</title>
  <meta name="description" content="記錄家中購買的重要物品、設備保固，以及陪伴我們共同經歷的重大事件，打造專屬於家人的幸福回憶庫。">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 頂部導覽列 -->
  <nav class="navbar" id="site-navbar">
    <div class="container navbar-container">
      <a href="#" class="brand" id="brand-logo">
        <span class="brand-icon">🏠</span>
        <span>我們的家庭檔案庫</span>
      </a>
      <div class="nav-links" id="nav-links-container">
        <button class="nav-btn active" id="nav-items-btn">📦 物品紀錄</button>
        <button class="nav-btn" id="nav-timeline-btn">⏳ 重大事件時間軸</button>
        <button class="nav-btn" id="nav-export-btn" title="將所有家庭紀錄匯出為 JSON 備份檔">📤 匯出備份</button>
        <button class="nav-btn" id="nav-import-btn" title="將 JSON 備份檔還原回家庭紀錄">📥 匯入備份</button>
        <input type="file" id="import-file-input" accept=".json" style="display: none;">
      </div>
    </div>
  </nav>

  <main class="container">
    
    <!-- 頂部全域統計面板 -->
    <section class="stats-section" id="global-stats-section">
      <div class="stats-grid" id="stats-container">
        <!-- 物品總數 -->
        <div class="stat-card" id="stat-card-total-items">
          <div class="stat-label">物品總數</div>
          <div class="stat-value" id="stat-total-items">0</div>
        </div>
        <!-- 本月新增物品 -->
        <div class="stat-card" id="stat-card-month-items">
          <div class="stat-label">本月新增物品</div>
          <div class="stat-value" id="stat-month-items">0</div>
        </div>
        <!-- 即將保固到期數 -->
        <div class="stat-card" id="stat-card-warranty-alert">
          <div class="stat-label">即將保固到期</div>
          <div class="stat-value" id="stat-warranty-alert" style="color: var(--tag-warranty-warn-text);">0</div>
        </div>
        <!-- 已關聯事件的物品數 -->
        <div class="stat-card" id="stat-card-related-items">
          <div class="stat-label">已關聯事件物品</div>
          <div class="stat-value" id="stat-related-items">0</div>
        </div>
        <!-- 今年重大事件數 -->
        <div class="stat-card" id="stat-card-year-events">
          <div class="stat-label">今年重大事件</div>
          <div class="stat-value" id="stat-year-events" style="color: var(--mood-important-text);">0</div>
        </div>
      </div>
    </section>

    <!-- 一、 家中物品紀錄頁 -->
    <section class="page-section active" id="items-page">
      <div class="page-header" id="items-page-header">
        <h1 class="page-title">家中物品紀錄</h1>
        <button class="btn btn-primary" id="add-item-btn">➕ 新增物品</button>
      </div>

      <!-- 物品搜尋篩選工具列 -->
      <div class="toolbar" id="items-toolbar">
        <div class="search-wrapper">
          <input type="text" class="search-input" id="item-search" placeholder="搜尋物品名稱、類別或備註...">
        </div>
        <select class="filter-select" id="item-category-filter">
          <option value="all">所有類別</option>
          <option value="家電">家電</option>
          <option value="家具">家具</option>
          <option value="廚房">廚房</option>
          <option value="清潔">清潔</option>
          <option value="寵物">寵物</option>
          <option value="其他">其他</option>
        </select>
        <select class="filter-select" id="item-sort-select">
          <option value="desc">購買日期：最新到最舊</option>
          <option value="asc">購買日期：最舊到最新</option>
        </select>
      </div>

      <!-- 物品展示區 -->
      <div class="items-grid" id="items-grid-container">
        <!-- 由 JavaScript 動態生成卡片 -->
      </div>
    </section>

    <!-- 二、 重大事件時間軸頁 -->
    <section class="page-section" id="timeline-page">
      <div class="page-header" id="timeline-page-header">
        <h1 class="page-title">重大事件時間軸</h1>
        <button class="btn btn-primary" id="add-event-btn">➕ 新增事件</button>
      </div>

      <!-- 事件搜尋篩選工具列 -->
      <div class="toolbar" id="events-toolbar">
        <div class="search-wrapper">
          <input type="text" class="search-input" id="event-search" placeholder="搜尋事件標題、說明或類別...">
        </div>
        <select class="filter-select" id="event-category-filter">
          <option value="all">所有事件類別</option>
          <option value="搬家">搬家</option>
          <option value="裝修">裝修</option>
          <option value="家電汰換">家電汰換</option>
          <option value="家庭活動">家庭活動</option>
          <option value="維修">維修</option>
          <option value="其他">其他</option>
        </select>
      </div>

      <!-- 時間軸展示區 -->
      <div class="timeline-container" id="timeline-container-el">
        <!-- 由 JavaScript 按年份分組動態生成 -->
      </div>
    </section>

  </main>

  <!-- ========================================== -->
  <!-- MODAL 1: 新增 / 編輯物品彈出視窗 -->
  <!-- ========================================== -->
  <div class="modal" id="item-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="item-modal-title">新增物品</h3>
        <button class="modal-close" id="item-modal-close-btn">&times;</button>
      </div>
      <form id="item-form">
        <input type="hidden" id="item-id">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="form-item-name">物品名稱 *</label>
            <input type="text" id="form-item-name" class="form-input" required placeholder="例如：Dyson V15 吸塵器">
          </div>
          
          <div class="form-group row">
            <div>
              <label class="form-label" for="form-item-category">類別 *</label>
              <select id="form-item-category" class="form-select" required>
                <option value="家電">家電</option>
                <option value="家具">家具</option>
                <option value="廚房">廚房</option>
                <option value="清潔">清潔</option>
                <option value="寵物">寵物</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="form-item-purchase-date">購買日期 *</label>
              <input type="date" id="form-item-purchase-date" class="form-input" required>
            </div>
          </div>

          <div class="form-group row">
            <div>
              <label class="form-label" for="form-item-price">購買金額 *</label>
              <input type="number" id="form-item-price" class="form-input" min="0" required placeholder="NT$">
            </div>
            <div>
              <label class="form-label" for="form-item-location">購買地點</label>
              <input type="text" id="form-item-location" class="form-input" placeholder="例如：Momo 購物網">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="form-item-warranty-expiry">保固到期日</label>
            <input type="date" id="form-item-warranty-expiry" class="form-input">
          </div>

          <div class="form-group">
            <label class="form-label" for="form-item-relation-select">關聯重大事件</label>
            <select id="form-item-relation-select" class="form-select">
              <option value="none">無關聯重大事件</option>
              <!-- 由 JavaScript 動態填入事件列表 -->
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="form-item-notes">備註</label>
            <textarea id="form-item-notes" class="form-textarea" placeholder="例如：保固書放在電視櫃第二格抽屜"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" id="item-modal-cancel">取消</button>
          <button type="submit" class="btn btn-primary" id="item-modal-submit">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- MODAL 2: 新增 / 編輯事件彈出視窗 -->
  <!-- ========================================== -->
  <div class="modal" id="event-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="event-modal-title">新增重大事件</h3>
        <button class="modal-close" id="event-modal-close-btn">&times;</button>
      </div>
      <form id="event-form">
        <input type="hidden" id="event-id">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="form-event-title">事件標題 *</label>
            <input type="text" id="form-event-title" class="form-input" required placeholder="例如：領養貓咪咪、新家落成">
          </div>

          <div class="form-group row">
            <div>
              <label class="form-label" for="form-event-date">事件日期 *</label>
              <input type="date" id="form-event-date" class="form-input" required>
            </div>
            <div>
              <label class="form-label" for="form-event-category">事件類別 *</label>
              <select id="form-event-category" class="form-select" required>
                <option value="搬家">搬家</option>
                <option value="裝修">裝修</option>
                <option value="家電汰換">家電汰換</option>
                <option value="家庭活動">家庭活動</option>
                <option value="維修">維修</option>
                <option value="其他">其他</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="form-event-mood">心情標籤 *</label>
            <select id="form-event-mood" class="form-select" required>
              <option value="開心">開心 😊</option>
              <option value="辛苦">辛苦 💦</option>
              <option value="紀念">紀念 🎗️</option>
              <option value="花錢">花錢 💸</option>
              <option value="重要">重要 📌</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">選擇關聯物品（可多選）</label>
            <div class="item-checkbox-list" id="form-event-items-list">
              <!-- 由 JavaScript 動態生成可多選的物品清單 -->
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="form-event-desc">事件說明 *</label>
            <textarea id="form-event-desc" class="form-textarea" required placeholder="簡單描述今天發生的溫暖小故事或備忘錄..." style="min-height: 100px;"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" id="event-modal-cancel">取消</button>
          <button type="submit" class="btn btn-primary" id="event-modal-submit">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- MODAL 3: 詳情檢視彈出視窗（通用） -->
  <!-- ========================================== -->
  <div class="modal" id="detail-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="detail-modal-title">詳情資訊</h3>
        <button class="modal-close" id="detail-modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" id="detail-modal-body">
        <!-- 由 JavaScript 動態生成詳細內容 -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="detail-modal-ok-btn">確定</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
